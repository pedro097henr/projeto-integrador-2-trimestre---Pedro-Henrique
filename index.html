      background: rgba(255,255,255,.06); font-weight: 800; transition: transform .2s, border-color .2s, box-shadow .2s;
    }
    .swatch:hover, .swatch.active { transform: translateY(-3px); border-color: var(--cyan); box-shadow: 0 0 20px rgba(55,231,255,.25); }

    .spectrum-labels { display: flex; justify-content: space-between; gap: 8px; color: #d4e6ff; font-size: .76rem; margin-bottom: 8px; }

    .band-violet { background: #8859ed; color: #8859ed; } .band-blue { background: #3b93f7; color: #3b93f7; }

    .readout { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; margin-top: 22px; }
